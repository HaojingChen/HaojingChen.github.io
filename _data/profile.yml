research:
- title: Enhancing Video Physical Consistency via Role-aware Joint Training and Modality-decoupled Denoising
  short_title: 视频生成的物理一致性
  venue: NeurIPS 2026
  classification: CCF-A
  status: 在投
  contribution: 共同第一作者
  year: '2026'
  summary: 针对视频生成模型难以保持物理一致性的问题，利用 Qwen3-VL、SAM3 与光流构建施动者、受控物体、被动物体和背景四类角色的物理先验。提出 VPT 微调框架，通过模态解耦去噪、辅助损失退火与跨步自引导，将物理运动先验注入视频扩散模型，在提升物理一致性的同时保持生成质量。
- title: 'MoECa: Accelerating Diffusion Transformers with Fine-Grained Expert Cache'
  short_title: DiT-MoE 推理加速
  venue: ACM MM 2026
  classification: CCF-A
  status: ''
  contribution: 共同第一作者
  year: '2026'
  summary: 针对缓存方法与 DiT-MoE 专家分解结构不匹配的问题，提出细粒度 Expert-Branch 特征缓存框架 MoECa，将缓存粒度由 token 级细化至 expert-branch 级，仅对关键分支进行重算，最高实现 2.93 倍推理加速。
- title: 'ORSIFlow: Saliency-Guided Rectified Flow for Optical Remote Sensing Salient Object Detection'
  short_title: 遥感显著目标检测
  venue: ICME 2026
  classification: CCF-B
  status: Spotlight
  contribution: 第一作者
  year: '2026'
  summary: 提出显著性引导的 Latent Rectified Flow 框架，在 VAE 隐空间学习从高斯噪声到显著图的确定性流，实现少步高效推理。基于 PVT 构建多尺度条件网络，并设计判别器进行全局语义建模；通过双分支门控校准器强化小目标与复杂边界，为流模型提供更准确的显著性条件先验。
- title: 'LumiDiff: A Luminous-Conditioned Diffusion Model for Low-Light Salient Object Detection'
  short_title: 低照度显著目标检测
  venue: IEEE CSCWD 2025
  classification: CCF-C
  status: Oral
  contribution: 共同第一作者
  year: '2025'
  summary: 提出基于光照条件引导的扩散模型，将低照度显著目标检测建模为条件掩码生成过程，通过 AFR 与 PRFR 模块增强特征表达，在 LLI 基准上显著优于现有方法。
- title: 'MiCEval: Unveiling Multimodal Chain of Thought''s Quality via Image Description and Reasoning Steps'
  short_title: 多模态思维链评估
  venue: NAACL 2025
  classification: CCF-B
  status: ''
  contribution: 第五作者
  year: '2025'
  summary: 提出细化至推理步骤的多模态思维链（CoT）评估框架，通过图像描述与推理步骤评估多模态推理质量，填补多模态大模型思维链评估领域的空白。
