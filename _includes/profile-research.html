<style>
  .personal-work-meta { margin: 8px 0; color: #9f5964; font-size: .82em; }
  .personal-work-summary { margin: 0; font-size: .9em; line-height: 1.75; }
  .publication-card strong { overflow-wrap: anywhere; }
</style>
{% for work in site.data.profile.research %}
<article class="publication-card{% unless work.contribution == '第五作者' %} first-author{% endunless %}">
  <div class="publication-card__layout">
    <div>
      <strong>{{ work.title | escape }}</strong>
      <p class="personal-work-meta">{{ work.contribution | escape }} · {{ work.venue | escape }} · {{ work.classification | escape }}{% if work.status != empty %} · <b>{{ work.status | escape }}</b>{% endif %}</p>
      <p class="personal-work-summary">{{ work.summary | escape }}</p>
    </div>
  </div>
</article>
{% endfor %}
